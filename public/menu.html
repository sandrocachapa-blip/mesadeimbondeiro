<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4A1A0C">
<title>Menu — Mesa de Imbondeiro</title>
<link rel="icon" href="/icon-192.png">
<style>
  body { margin: 0; background: #FAF3E8; color: #4A1A0C; font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .w { max-width: 620px; margin: 0 auto; padding: 20px 18px 60px; }
  header { text-align: center; padding: 10px 0 4px; }
  header img { width: 230px; max-width: 70%; }
  header p { margin: 4px 0 0; color: #6B3A26; }
  nav { position: sticky; top: 0; background: #FAF3E8; display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; border-bottom: 2px solid #4A1A0C; }
  nav a { border: 1.5px solid #4A1A0C; border-radius: 99px; padding: 6px 14px; text-decoration: none; color: #4A1A0C; font-weight: 600; white-space: nowrap; }
  h2 { font-family: 'Cooper Black', 'Rockwell Extra Bold', Georgia, serif; color: #B03F1B; margin: 26px 0 6px; font-size: 22px; scroll-margin-top: 60px; }
  .a { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px dashed #E2CFB2; }
  .a div { flex: 1; } .a b { display: block; } .a small { color: #6B3A26; }
  .a span { font-weight: 700; white-space: nowrap; }
  .a { align-items: center; } .q { display: flex; align-items: center; gap: 8px; }
  .q button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: #B03F1B; color: #fff; font-size: 22px; font-weight: 700; box-shadow: 0 3px 0 #7A2A10; }
  .q button[data-m] { background: #fff; color: #4A1A0C; box-shadow: 0 3px 0 #C9B08C; }
  .ok { background: #E4EFDD; border-left: 5px solid #4F7A3A; border-radius: 8px; padding: 10px 14px; margin: 12px 0; } .ok.erro { background: #FBE9DF; border-color: #B03F1B; }
  #cesto { display: none; position: fixed; left: 0; right: 0; bottom: 0; background: #4A1A0C; color: #FAF3E8; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; box-shadow: 0 -8px 24px rgba(0,0,0,.3); }
  #cesto button { border: 0; border-radius: 12px; background: #CC5A31; color: #fff; font: inherit; padding: 12px 18px; box-shadow: 0 3px 0 #7A2A10; }
  .bres { border: 0; border-radius: 12px; background: #B03F1B; color: #fff; font: 700 16px system-ui, sans-serif; padding: 12px 22px; box-shadow: 0 3px 0 #7A2A10; cursor: pointer; }
  #fRes { background: #FFFDF9; border: 1.5px solid #E2CFB2; border-radius: 14px; padding: 6px 16px 10px; margin: 10px 0; }
  #fRes label { display: block; font-size: 13px; font-weight: 600; color: #6B3A26; margin-top: 10px; }
  #fRes input { display: block; width: 100%; box-sizing: border-box; font: 16px system-ui, sans-serif; padding: 10px 12px; border: 1.5px solid #E2CFB2; border-radius: 10px; margin-top: 4px; background: #fff; color: #4A1A0C; }
  .dois { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  footer { text-align: center; color: #6B3A26; font-size: 13px; margin-top: 30px; }
</style>
</head>
<body>
<div class="w">
  <header><img src="/logo.png" alt="Mesa de Imbondeiro"><p id="local"></p></header>
  <nav id="nav"></nav>
  <div style="text-align:center;margin:10px 0 4px"><button id="btRes" class="bres">Reservar mesa</button></div>
  <form id="fRes" style="display:none">
    <h2 style="margin-top:8px">Reservar mesa</h2>
    <label>Nome<input name="nome" required maxlength="80" autocomplete="name"></label>
    <label>Telefone<input name="telefone" required type="tel" maxlength="30" autocomplete="tel"></label>
    <div class="dois"><label>Dia<input name="dia" type="date" required></label><label>Hora<input name="hora" type="time" required value="20:00"></label></div>
    <label>Número de pessoas<input name="pessoas" type="number" min="1" max="40" value="2" required></label>
    <label>Notas (opcional)<input name="notas" maxlength="200" placeholder="Aniversário, alergias, cadeira de bebé…"></label>
    <button class="bres" style="width:100%;margin-top:12px">Pedir reserva</button>
    <p style="font-size:13px;color:#6B3A26;text-align:center">A reserva só fica garantida depois de o restaurante a confirmar.</p>
  </form>
  <div id="msg"></div>
  <div id="menu"><p style="text-align:center">A carregar o menu…</p></div>
  <footer>Preços em kwanzas, com impostos incluídos.</footer>
</div>
<div id="cesto"><span id="cestoTxt"></span><button id="enviar">Enviar pedido</button></div>
<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kz = (n) => new Intl.NumberFormat('pt-PT', { maximumFractionDigits: 0 }).format(Math.round(n || 0)).replace(/\s/g, ' ') + ' Kz';
const qs = new URLSearchParams(location.search), l = qs.get('l') || 'principal', mesaId = qs.get('m') || '';
let M = null; const cesto = {};
const el = (id) => document.getElementById(id);
function desenha() {
  el('menu').innerHTML = M.familias.map((f, i) => `<h2 id="f${i}">${esc(f.nome)}</h2>` + f.artigos.map((a) => `<div class="a"><div><b>${esc(a.nome)}</b><small>${esc(a.descricao)}</small></div><span>${kz(a.preco)}</span>${M.mesa ? `<div class="q">${cesto[a.id] ? `<button data-m="${a.id}">−</button><b>${cesto[a.id]}</b>` : ''}<button data-p="${a.id}">+</button></div>` : ''}</div>`).join('')).join('');
  const arts = M.familias.flatMap((f) => f.artigos), n = Object.values(cesto).reduce((s, x) => s + x, 0), t = arts.reduce((s, a) => s + (cesto[a.id] || 0) * a.preco, 0);
  el('cesto').style.display = n ? 'flex' : 'none'; el('cestoTxt').textContent = n + (n === 1 ? ' artigo · ' : ' artigos · ') + kz(t);
}
document.addEventListener('click', async (e) => {
  const p = e.target.dataset.p, m = e.target.dataset.m;
  if (p) { cesto[p] = Math.min(20, (cesto[p] || 0) + 1); desenha(); }
  if (m) { cesto[m] = (cesto[m] || 0) - 1; if (cesto[m] <= 0) delete cesto[m]; desenha(); }
  if (e.target.id === 'enviar') {
    e.target.disabled = true;
    try {
      const r = await fetch('/api/pedido-publico', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ l, mesa: mesaId, itens: Object.entries(cesto).map(([artigo_id, qtd]) => ({ artigo_id, qtd })) }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.erro || 'Não foi possível enviar');
      Object.keys(cesto).forEach((k) => delete cesto[k]); desenha();
      el('msg').innerHTML = '<div class="ok"><b>Pedido recebido.</b><br>O empregado vai confirmá-lo consigo antes de seguir para a cozinha.</div>'; window.scrollTo(0, 0);
    } catch (er) { el('msg').innerHTML = '<div class="ok erro">' + esc(er.message) + '</div>'; window.scrollTo(0, 0); }
    e.target.disabled = false;
  }
});
const fRes = el('fRes'), hojeL = new Date(Date.now() + 3600e3).toISOString().slice(0, 10);
fRes.dia.min = hojeL; fRes.dia.value = hojeL;
const abreRes = () => { fRes.style.display = 'block'; el('btRes').style.display = 'none'; fRes.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
el('btRes').onclick = abreRes; if (location.hash === '#reservar') abreRes();
fRes.onsubmit = async (e) => {
  e.preventDefault(); const bt = fRes.querySelector('button'); bt.disabled = true;
  try {
    const r = await fetch('/api/reserva-publica', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ l, nome: fRes.nome.value, telefone: fRes.telefone.value, dia: fRes.dia.value, hora: fRes.hora.value, pessoas: fRes.pessoas.value, notas: fRes.notas.value }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.erro || 'Não foi possível enviar o pedido');
    fRes.style.display = 'none'; el('msg').innerHTML = '<div class="ok"><b>Pedido de reserva recebido.</b><br>' + esc(j.local) + ' vai confirmar consigo pelo telefone que indicou.</div>'; window.scrollTo(0, 0);
  } catch (er) { el('msg').innerHTML = '<div class="ok erro">' + esc(er.message) + '</div>'; }
  bt.disabled = false;
};
fetch('/api/menu?l=' + encodeURIComponent(l) + (mesaId ? '&m=' + encodeURIComponent(mesaId) : '')).then((r) => r.json()).then((m) => {
  if (m.erro) throw new Error(m.erro);
  M = m;
  el('local').textContent = m.local + (m.mesa ? ' · ' + m.mesa.nome : '') + (m.morada ? ' · ' + m.morada : '');
  el('nav').innerHTML = m.familias.map((f, i) => `<a href="#f${i}">${esc(f.nome)}</a>`).join('');
  if (m.mesa) el('msg').innerHTML = '<div class="ok">Pode pedir a partir daqui: toque em + nos artigos e envie o pedido.</div>';
  desenha();
}).catch((e) => { el('menu').innerHTML = '<p style="text-align:center">Não foi possível carregar o menu. ' + esc(e.message) + '</p>'; });
</script>

</body>
</html>
